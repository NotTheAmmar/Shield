networks:
  shield-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: shield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shield-network
    depends_on:
      - shield-gateway
      - shield-frontend

  db-users:
    image: postgis/postgis:15-3.4-alpine
    container_name: db-users
    networks:
      - shield-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data

  db-ledger:
    image: codenotary/immudb:latest
    container_name: db-ledger
    networks:
      - shield-network
    environment:
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    expose:
      - "3322"
    volumes:
      - immudb-data:/var/lib/immudb

  minio-store:
    image: minio/minio
    container_name: minio-store
    networks:
      - shield-network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data

  shield-gateway:
    build: ./shield-gateway
    container_name: shield-gateway
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-gateway
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-gateway/package.json
    networks:
      - shield-network
    ports:
      - "3001:3001"

  shield-frontend:
    build: ./shield-frontend
    container_name: shield-frontend
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-frontend
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-frontend/package.json
    networks:
      - shield-network
    environment:
      VITE_GATEWAY_URL: http://shield-gateway:3001
    ports:
      - "3000:3000"
    depends_on:
      - shield-gateway

  shield-auth:
    build: ./shield-auth
    container_name: shield-auth
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-auth
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-auth/package.json
    networks:
      - shield-network
    expose:
      - "4000"
    environment:
      DB_HOST: db-users
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
      ADMIN_SEED_EMPLOYEE_ID: ${ADMIN_SEED_EMPLOYEE_ID}
    depends_on:
      - db-users

  shield-evidence:
    build: ./shield-evidence
    container_name: shield-evidence
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-evidence
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-evidence/package.json
    networks:
      - shield-network
    expose:
      - "4001"
    env_file:
      - ./shield-evidence/.env.docker
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      MASTER_KEY: ${MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - minio-store
      - shield-ledger
      - redis

  shield-ledger:
    build: ./shield-ledger
    container_name: shield-ledger
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-ledger
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-ledger/package.json
    networks:
      - shield-network
    expose:
      - "4002"
    environment:
      IMMUDB_HOST: db-ledger
      IMMUDB_USER: ${IMMUDB_USER}
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
    depends_on:
      - db-ledger

  shield-watchdog:
    build: ./shield-watchdog
    container_name: shield-watchdog
    restart: unless-stopped
    networks:
      - shield-network
    environment:
      MASTER_KEY: ${MASTER_KEY}
      WATCHDOG_INTERVAL: 30
    depends_on:
      - shield-evidence
      - shield-ledger

  redis:
    image: redis:7-alpine
    container_name: shield-redis
    restart: unless-stopped
    networks:
      - shield-network
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./.docker-data/redis:/data

  shield-metadata-extractor:
    build: ./shield-metadata-extractor
    container_name: shield-metadata-extractor
    restart: unless-stopped
    networks:
      - shield-network
    volumes:
      - extractor-processing:/processing
    environment:
      DB_HOST: db-users
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: shield-redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio-store
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: evidence
    depends_on:
      - redis
      - minio-store

volumes:
  immudb-data:
  extractor-processing:
