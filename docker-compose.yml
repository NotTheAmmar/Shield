networks:
  shield-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: shield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shield-network
    depends_on:
      - shield-gateway
      - shield-frontend

  db-users:
    image: postgis/postgis:15-3.4-alpine
    container_name: db-users
    networks:
      - shield-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data

  minio-store:
    image: minio/minio
    container_name: minio-store
    networks:
      - shield-network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data

  shield-gateway:
    build: ./shield-gateway
    container_name: shield-gateway
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-gateway
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-gateway/package.json
    networks:
      - shield-network
    ports:
      - "3001:3001"

  shield-frontend:
    build: ./shield-frontend
    container_name: shield-frontend
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-frontend
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-frontend/package.json
    networks:
      - shield-network
    environment:
      VITE_GATEWAY_URL: http://shield-gateway:3001
    ports:
      - "3000:3000"
    depends_on:
      - shield-gateway

  shield-auth:
    build: ./shield-auth
    container_name: shield-auth
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-auth
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-auth/package.json
    networks:
      - shield-network
    expose:
      - "4000"
    environment:
      DB_HOST: db-users
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
      ADMIN_SEED_EMPLOYEE_ID: ${ADMIN_SEED_EMPLOYEE_ID}
      BLOCKCHAIN_ENCRYPTION_KEY: ${BLOCKCHAIN_ENCRYPTION_KEY}
      MASTER_KEY: ${MASTER_KEY}
      LEDGER_SERVICE_URL: http://shield-ledger:4002
    depends_on:
      - db-users
      - shield-ledger

  shield-evidence:
    build: ./shield-evidence
    container_name: shield-evidence
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-evidence
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-evidence/package.json
    networks:
      - shield-network
    expose:
      - "4001"
    env_file:
      - ./shield-evidence/.env.docker
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      MASTER_KEY: ${MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      BLOCKCHAIN_ENCRYPTION_KEY: ${BLOCKCHAIN_ENCRYPTION_KEY}
    depends_on:
      - minio-store
      - shield-ledger

  shield-ledger:
    build: ./shield-ledger
    container_name: shield-ledger
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./shield-ledger
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./shield-ledger/package.json
    networks:
      - shield-network
    expose:
      - "4002"
    environment:
      BLOCKCHAIN_RPC_URL: http://node-police:8545
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS}
      BLOCKCHAIN_DEPLOYER_PRIVATE_KEY: ${BLOCKCHAIN_DEPLOYER_PRIVATE_KEY}
      MASTER_KEY: ${MASTER_KEY}

  shield-watchdog:
    build: ./shield-watchdog
    container_name: shield-watchdog
    restart: unless-stopped
    networks:
      - shield-network
    environment:
      MASTER_KEY: ${MASTER_KEY}
      WATCHDOG_INTERVAL: 30
    depends_on:
      - shield-evidence
      - shield-ledger

