name: SHIELD CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm run setup

      - name: Initialize Environment Variables
        run: |
          cp .env.example .env

          # Replace all placeholder credentials with working CI values
          sed -i 's/^POSTGRES_USER=.*/POSTGRES_USER=shield_ci/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=shield_ci_pass/' .env
          sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=shield_ci/' .env
          sed -i 's/^MINIO_ROOT_USER=.*/MINIO_ROOT_USER=shield_ci/' .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=shield_ci_minio_pass/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_jwt_secret_key_for_testing_only/' .env
          sed -i 's/^MASTER_KEY=.*/MASTER_KEY=ci_master_key_for_testing_only_2026/' .env

          # Extract deployer private key from keystore
          sed -i '/BLOCKCHAIN_DEPLOYER_PRIVATE_KEY=/d' .env
          PRIVATE_KEY=$(node -e "const {ethers}=require('ethers'),fs=require('fs'); (async()=>{const w=await ethers.Wallet.fromEncryptedJson(fs.readFileSync('./blockchain/keystore/police-account.json','utf8'), fs.readFileSync('./blockchain/password.txt','utf8').trim()); console.log(w.privateKey)})()")
          if [ -z "$PRIVATE_KEY" ]; then echo "FATAL: Failed to extract deployer private key"; exit 1; fi
          echo "BLOCKCHAIN_DEPLOYER_PRIVATE_KEY=$PRIVATE_KEY" >> .env
          echo "Deployer key extracted successfully"
          echo "--- CI .env initialized ---"
          grep -v 'PRIVATE_KEY\|PASSWORD\|SECRET\|MASTER_KEY' .env || true

      - name: Create Shared Docker Network
        run: |
          docker network create \
            --label "com.docker.compose.network=shield-network" \
            --label "com.docker.compose.project=shield" \
            --label "com.docker.compose.version=2" \
            shield_shield-network || true

      - name: Boot Blockchain Network
        run: |
          npm run blockchain:up
          echo "Waiting 5 seconds for blockchain nodes to stabilize..."
          sleep 5
          docker ps -a

      - name: Deploy Smart Contract
        run: |
          DEPLOYED_ADDR=$(npx hardhat run scripts/deploy.js --network localnet | grep -oE "0x[0-9a-fA-F]{40}" | head -1)
          sed -i '/BLOCKCHAIN_CONTRACT_ADDRESS=/d' .env
          echo "BLOCKCHAIN_CONTRACT_ADDRESS=$DEPLOYED_ADDR" >> .env
          echo "Deployed contract to $DEPLOYED_ADDR"

      - name: Boot Docker Compose Stack
        run: |
          docker compose up -d
          echo "Waiting 20 seconds for database and storage containers to stabilize..."
          sleep 20
          docker ps -a

      - name: Seed Database & Storage
        run: |
          npm run seed

      - name: Run Smart Contract Unit Tests
        run: |
          npm run test:contract

      - name: Run Integration Test Suite
        run: |
          npm run test:comprehensive

      - name: Run Evidence Tampering Simulation
        run: |
          npm run test:tamper

      - name: Run Blockchain Integration Tests
        run: |
          npm run test:blockchain

      - name: Teardown Stack
        if: always()
        run: |
          npm run blockchain:down || true
          docker compose down -v
