name: SHIELD CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm run setup

      - name: Initialize Environment Variables
        run: |
          cp .env.example .env

      - name: Boot Docker Compose Stack
        run: |
          docker compose up -d
          echo "Waiting 20 seconds for database and storage containers to stabilize..."
          sleep 20
          docker ps -a

      - name: Seed Database & Storage
        run: |
          npm run seed

      - name: Run Integration Test Suite
        run: |
          npm run test:comprehensive

      - name: Run Evidence Tampering Simulation
        run: |
          npm run test:tamper

      - name: Teardown Stack
        if: always()
        run: |
          docker compose down -v
