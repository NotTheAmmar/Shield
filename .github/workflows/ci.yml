name: SHIELD CI

on:
  push:
    branches: [main, master, feat-blockchain-wallets]
  pull_request:
    branches: [main, master, feat-blockchain-wallets]

jobs:
  test:
    name: Build & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm run setup

      - name: Initialize Environment Variables
        run: |
          cp .env.example .env

      - name: Boot Docker Compose Stack
        run: |
          docker compose up -d
          echo "Waiting for database and storage containers to stabilize..."
          for i in {1..30}; do
            if docker compose logs shield-auth | grep -q "Database tables and seeds ready" && \
               docker compose logs shield-evidence | grep -q "Database schemas (FIR, Evidence, Audit) ready"; then
              echo "Migrations completed successfully!"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for migrations to complete!"
          docker compose logs shield-auth
          docker compose logs shield-evidence
          exit 1

      - name: Seed Database & Storage
        run: |
          npm run seed

      - name: Run Smart Contract Unit Tests
        run: |
          npm run test:contract

      - name: Run Integration Test Suite
        run: |
          npm run test:comprehensive

      - name: Run Evidence Tampering Simulation
        run: |
          npm run test:tamper

      - name: Boot Blockchain Network
        run: |
          npm run blockchain:up
          echo "Waiting 5 seconds for blockchain nodes to stabilize..."
          sleep 5
          docker ps -a

      - name: Run Blockchain Integration Tests
        run: |
          npm run test:blockchain

      - name: Teardown Stack
        if: always()
        run: |
          npm run blockchain:down || true
          docker compose down -v
