# SHIELD — Production Docker Compose Deployment
# Spins up the complete system by pulling custom images from Docker Hub
# and official third-party databases from public registries.
#
# Usage:
#   DOCKER_USER=your_dockerhub_username docker compose -f docker-compose.prod.yml up -d

networks:
  shield-network:
    driver: bridge

services:
  # ── Edge Proxy (Official Nginx Image) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shield-network
    depends_on:
      - shield-gateway
      - shield-frontend

  # ── Relational Database (Official PostGIS Image) ───────────────────────────
  db-users:
    image: postgis/postgis:15-3.4-alpine
    container_name: db-users
    restart: always
    networks:
      - shield-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data

  # ── Immutable Ledger Database (Official Immudb Image) ─────────────────────
  db-ledger:
    image: codenotary/immudb:latest
    container_name: db-ledger
    restart: always
    networks:
      - shield-network
    environment:
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    expose:
      - "3322"
    volumes:
      - immudb-data:/var/lib/immudb

  # ── Object Storage (Official MinIO Image) ──────────────────────────────────
  minio-store:
    image: minio/minio
    container_name: minio-store
    restart: always
    networks:
      - shield-network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data

  # ── Custom BFF Gateway (Pushed Custom Image) ──────────────────────────────
  shield-gateway:
    image: ${DOCKER_USER}/shield-gateway:latest
    container_name: shield-gateway
    restart: always
    networks:
      - shield-network
    ports:
      - "3001:3001"

  # ── Custom React Frontend Client (Pushed Custom Image) ────────────────────
  shield-frontend:
    image: ${DOCKER_USER}/shield-frontend:latest
    container_name: shield-frontend
    restart: always
    networks:
      - shield-network
    environment:
      VITE_GATEWAY_URL: http://shield-gateway:3001
    ports:
      - "3000:3000"
    depends_on:
      - shield-gateway

  # ── Custom Authentication Service (Pushed Custom Image) ───────────────────
  shield-auth:
    image: ${DOCKER_USER}/shield-auth:latest
    container_name: shield-auth
    restart: always
    networks:
      - shield-network
    expose:
      - "4000"
    environment:
      DB_HOST: db-users
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
      ADMIN_SEED_EMPLOYEE_ID: ${ADMIN_SEED_EMPLOYEE_ID}
    depends_on:
      - db-users

  # ── Custom Evidence Locker Service (Pushed Custom Image) ──────────────────
  shield-evidence:
    image: ${DOCKER_USER}/shield-evidence:latest
    container_name: shield-evidence
    restart: always
    networks:
      - shield-network
    expose:
      - "4001"
    env_file:
      - ./shield-evidence/.env.docker
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      MASTER_KEY: ${MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - minio-store
      - shield-ledger

  # ── Custom Ledger Interface (Pushed Custom Image) ─────────────────────────
  shield-ledger:
    image: ${DOCKER_USER}/shield-ledger:latest
    container_name: shield-ledger
    restart: always
    networks:
      - shield-network
    expose:
      - "4002"
    environment:
      IMMUDB_HOST: db-ledger
      IMMUDB_USER: ${IMMUDB_USER}
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
    depends_on:
      - db-ledger

  # ── Custom Integrity Watchdog Daemon (Pushed Custom Image) ─────────────────
  shield-watchdog:
    image: ${DOCKER_USER}/shield-watchdog:latest
    container_name: shield-watchdog
    restart: unless-stopped
    networks:
      - shield-network
    environment:
      MASTER_KEY: ${MASTER_KEY}
      WATCHDOG_INTERVAL: 30
    depends_on:
      - shield-evidence
      - shield-ledger

volumes:
  immudb-data:
